name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(bun -p 'require("./package.json").version')"
      - run: bun run typecheck
      - run: bun test
  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          - { target: bun-darwin-x64, name: spaceship-darwin-x64 }
          - { target: bun-darwin-arm64, name: spaceship-darwin-arm64 }
          - { target: bun-linux-x64, name: spaceship-linux-x64 }
          - { target: bun-linux-arm64, name: spaceship-linux-arm64 }
          - { target: bun-windows-x64, name: spaceship-windows-x64.exe }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: mkdir -p dist && bun build src/index.ts --compile --target=${{ matrix.target }} --outfile=dist/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.name }}', path: 'dist/${{ matrix.name }}' }
  publish:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify package contents
        run: bun pm pack --dry-run
      - name: Publish package to npm
        run: npm publish --access public
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
        env: { GH_TOKEN: '${{ github.token }}' }
